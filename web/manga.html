<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#000000">
  <meta name="description" content="Key facts about a Japanese manga.">
  <!-- The full title is filled in by manga.js; the name here is for
       apps that don't run JavaScript. -->
  <title>{{APP_NAME}}</title>

  <link rel="icon" href="/favicon.ico" type="image/svg+xml">

  <!-- The icon an iPhone uses when the site is added to the home screen. -->
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">

  <!-- Link previews: what chat apps and social sites show when someone
       shares a link to the site. Those apps don't run JavaScript, so the
       Go server fills in the name and the site's address where the double
       braces are (see fillPlaceholders in web.go). -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="{{APP_NAME}}">
  <meta property="og:title" content="{{APP_NAME}}">
  <meta property="og:description" content="Look up Japanese manga: search a title and see the key facts at a glance.">
  <meta property="og:image" content="{{SITE_URL}}/og-image.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="The {{APP_NAME}} wordmark: explore your next manga">
  <meta name="twitter:card" content="summary_large_image">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400;0,500;0,600;0,900;1,400&display=swap">

  <!-- The shared styles first, then this page's own. -->
  <link rel="stylesheet" href="/static/css/base.css">
  <link rel="stylesheet" href="/static/css/title.css">
  <script type="module" src="/static/js/manga.js"></script>
</head>
<body>
  <main class="title-page">

    <!-- One line on top: the small SANKOMANGA wordmark on the left (back
         to the home page; common.js turns it into the two-tone wordmark),
         and a search icon on the right (back to the search results this
         title came from; manga.js sets where it goes, home if there was
         no search). -->
    <header class="title-header">
      <a class="mini-wordmark" href="/" data-mini-wordmark>{{APP_NAME}}</a>
      <a class="icon-link back-to-results" href="/" aria-label="Back to search results" title="Back to search results">
        <span>back to</span>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <circle cx="10.5" cy="10.5" r="6.5" stroke="currentColor" stroke-width="1.9"/>
          <path d="M15.5 15.5l5 5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        </svg>
      </a>
    </header>

    <!-- The title: cover on the left, details on the right (stacked on
         phones). manga.js fills it in. While loading ("is-loading"), the
         cover shimmers and faint bars stand in for the text. -->
    <article class="title is-loading" aria-busy="true">
      <div class="title-cover"></div>

      <div class="title-body">
        <div class="title-skeleton" aria-hidden="true">
          <div class="card-line"></div>
          <div class="card-line card-line--short"></div>
          <div class="card-line"></div>
          <div class="card-line"></div>
          <div class="card-line card-line--short"></div>
        </div>

        <h1 class="title-name"></h1>
        <p class="title-subtitle"></p>
        <!-- e.g. "Manga · Finished · 2009 · 141 chapters · 34 volumes" -->
        <p class="title-facts"></p>
        <!-- e.g. "★ 8.4" -->
        <p class="title-score"></p>
        <ul class="title-genres" aria-label="Genres"></ul>
        <div class="title-synopsis"></div>
        <a class="title-link" target="_blank" rel="noopener noreferrer">View on AniList ↗</a>
      </div>
    </article>

    <!-- "This title isn't available here." or an error, instead of the title. -->
    <p class="title-message" aria-live="polite"></p>
  </main>

  <footer class="site-footer">
    <!-- AniList's official logo, loaded from their own server (so it's
         always their current logo, in its original colours). The alt
         text means screen readers still announce "Data from AniList". -->
    Data from <a class="footer-logo-link" href="https://anilist.co" target="_blank" rel="noopener noreferrer"><img src="https://anilist.co/img/icons/icon.svg" alt="AniList" width="18" height="18"></a>
  </footer>
</body>
</html>
