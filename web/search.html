<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#000000">
  <meta name="description" content="Search results for Japanese manga.">
  <!-- The real title is filled in by search.js. -->
  <title></title>

  <link rel="icon" href="/favicon.ico" type="image/svg+xml">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400;0,500;0,600;0,900;1,400&display=swap">

  <link rel="stylesheet" href="/static/css/style.css">
  <script type="module" src="/static/js/search.js"></script>
</head>
<body>
  <main class="results-page">

    <!-- Header, lined up with the left edge of the grid: the small
         SANKOMANGA wordmark (back to the home page), then a small search
         line holding the current search term (type and press Enter to
         search again), then the count. -->
    <header class="results-header">
      <!-- common.js turns this into the two-tone wordmark. -->
      <a class="mini-wordmark" href="/" data-mini-wordmark>sankomanga</a>

      <form class="search search--line search--small" action="/search" method="get" role="search">
        <label class="visually-hidden" for="search-input">Search manga</label>
        <input
          class="search-input"
          id="search-input"
          type="search"
          name="q"
          placeholder="Search…"
          maxlength="100"
          autocomplete="off"
          spellcheck="false"
          enterkeyhint="search"
          required>
        <button class="search-button" type="submit" aria-label="Search">
          <!-- A magnifying glass, as on the home page. Enter searches too. -->
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <circle cx="10.5" cy="10.5" r="6.5" stroke="currentColor" stroke-width="1.9"/>
            <path d="M15.5 15.5l5 5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          </svg>
        </button>
      </form>

      <!-- "12 results", or a message such as "No manga found". -->
      <p class="results-status" aria-live="polite"></p>
    </header>

    <!-- The cards, filled in by search.js. -->
    <ul class="results-grid" aria-label="Search results"></ul>

    <!-- e.g. "Showing the 20 best matches." -->
    <p class="results-note"></p>
  </main>

  <footer class="site-footer">
    <!-- AniList's official logo, loaded from their own server (so it's
         always their current logo, in its original colours). The alt
         text means screen readers still announce "Data from AniList". -->
    Data from <a class="footer-logo-link" href="https://anilist.co" target="_blank" rel="noopener noreferrer"><img src="https://anilist.co/img/icons/icon.svg" alt="AniList" width="18" height="18"></a>
  </footer>
</body>
</html>
