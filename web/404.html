<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#000000">
  <!-- The real title ("Page not found · manga-app") is set by the script below. -->
  <title>Page not found</title>

  <link rel="icon" href="/favicon.ico" type="image/svg+xml">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400;0,500;0,600;1,400&display=swap">

  <link rel="stylesheet" href="/static/css/style.css">
  <script type="module">
    import { fillBranding } from "/static/js/common.js";
    fillBranding("Page not found");
  </script>
</head>
<body>
  <!-- Shown (by web.go) for any address that isn't a page of the site. -->
  <main class="notfound-page">
    <h1 class="notfound-title">Page not found</h1>
    <p class="notfound-text">There's nothing at this address.</p>
    <a class="icon-link" href="/" aria-label="Back to home" title="Back to home">
      <span>back to</span>
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <path d="M4 10.5L12 4l8 6.5V19a1 1 0 0 1-1 1h-4.5v-5.5h-5V20H5a1 1 0 0 1-1-1v-8.5z" stroke="currentColor" stroke-width="1.75" stroke-linejoin="round"/>
      </svg>
    </a>
  </main>

  <footer class="site-footer">
    <!-- AniList's official logo, loaded from their own server (so it's
         always their current logo, in its original colours). The alt
         text means screen readers still announce "Data from AniList". -->
    Data from <a class="footer-logo-link" href="https://anilist.co" target="_blank" rel="noopener noreferrer"><img src="https://anilist.co/img/icons/icon.svg" alt="AniList" width="18" height="18"></a>
  </footer>
</body>
</html>
