<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#000000">
  <meta name="description" content="Look up Japanese manga: search a title and see the key facts at a glance.">
  <!-- The full title is filled in by common.js from config.js; the name
       here is for apps that don't run JavaScript. -->
  <title>{{APP_NAME}}</title>

  <!-- The browser tab icon (web/favicon.svg, served at /favicon.ico). -->
  <link rel="icon" href="/favicon.ico" type="image/svg+xml">

  <!-- The icon an iPhone uses when the site is added to the home screen. -->
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">

  <!-- Link previews: what chat apps and social sites show when someone
       shares a link to the site. Those apps don't run JavaScript, so the
       Go server fills in the name and the site's address where the double
       braces are (see fillPlaceholders in web.go). -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="{{APP_NAME}}">
  <meta property="og:title" content="{{APP_NAME}}">
  <meta property="og:description" content="Look up Japanese manga: search a title and see the key facts at a glance.">
  <meta property="og:url" content="{{SITE_URL}}/">
  <meta property="og:image" content="{{SITE_URL}}/og-image.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="The {{APP_NAME}} wordmark: explore your next manga">
  <meta name="twitter:card" content="summary_large_image">

  <!-- The Inter font, from Google Fonts. "preconnect" starts the
       connection early so the font arrives sooner. -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <!-- "ital,wght@0,…;1,400" = regular 400/500/600, the extra-heavy 900
       (for the big name on the home page), plus a real italic 400 (for the
       tagline), so the browser doesn't fake italics by slanting. -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400;0,500;0,600;0,900;1,400&display=swap">

  <link rel="stylesheet" href="/static/css/style.css">

  <!-- type="module" lets our scripts import from each other
       (home.js imports config.js and common.js). -->
  <script type="module" src="/static/js/home.js"></script>

  <!-- Head starts for the browser. Without these, it would only find out
       about the scripts home.js imports after downloading home.js, and
       about the covers list after running it: each a full extra trip to
       the server, which on a phone can be 100-300ms. With them, it fetches
       everything at once. When home.js then asks for these, they're
       already here (or on their way), not fetched twice.
       "crossorigin" on the covers list makes this download match the way
       home.js's fetch() asks for it, which the browser needs in order to
       reuse it. -->
  <link rel="modulepreload" href="/static/js/common.js">
  <link rel="modulepreload" href="/static/js/config.js">
  <link rel="modulepreload" href="/static/js/search-overlay.js">
  <link rel="preload" href="/api/showcase" as="fetch" crossorigin>
</head>
<body>
  <main class="home">

    <!-- A few popular manga covers floating around the name. home.js
         places the covers. aria-hidden hides them from screen readers, since they're
         only decoration. -->
    <div class="volumes" aria-hidden="true"></div>

    <!-- In the middle: the name and tagline. The search box opens on top
         of the page (see .search-overlay below and search-overlay.js). -->
    <div class="home-intro">
      <div class="brand">
        <!-- home.js turns the name into the wordmark: SANKO in white
             (taking turns with サンコー), then MANGA in grey. -->
        <h1 class="brand-name" data-app-name></h1>
        <p class="brand-tagline" data-tagline></p>
      </div>
    </div>

    <!-- The small print, in the bottom corners: the search hint on the
         left, the AniList credit on the right. -->
    <div class="home-corners">
      <!-- A real button, so keyboard and screen-reader users can open the
           search too. The CSS shows the wording that fits the device. -->
      <button class="search-hint" type="button" aria-haspopup="dialog">
        <span class="search-hint--keys">Type to search</span>
        <span class="search-hint--touch">Tap to search</span>
      </button>

      <!-- The AniList credit, here instead of in a footer (the other pages
           keep theirs). AniList's official logo, loaded from their own
           server; the alt text means screen readers still announce "Data
           from AniList". -->
      <p class="home-credit">
        Data from <a class="footer-logo-link" href="https://anilist.co" target="_blank" rel="noopener noreferrer"><img src="https://anilist.co/img/icons/icon.svg" alt="AniList" width="14" height="14"></a>
      </p>
    </div>
  </main>

  <!-- The search box, opened on top of the blurred page by typing, "/",
       clicking or tapping anywhere, or the hint in the corner. Hidden until then.
       It's a plain HTML form: Enter goes to /search?q=... -->
  <div class="search-overlay" role="dialog" aria-modal="true" aria-label="Search manga" hidden>
    <form class="search search--line search--overlay" action="/search" method="get" role="search">
      <label class="visually-hidden" for="search-input">Search manga</label>
      <input
        class="search-input"
        id="search-input"
        type="search"
        name="q"
        placeholder="Search…"
        maxlength="100"
        autocomplete="off"
        spellcheck="false"
        enterkeyhint="search"
        required>
      <button class="search-button" type="submit" aria-label="Search">
        <!-- A magnifying glass (the same icon as "back to search" on the
             title page). Pressing Enter searches too. -->
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <circle cx="10.5" cy="10.5" r="6.5" stroke="currentColor" stroke-width="1.9"/>
          <path d="M15.5 15.5l5 5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        </svg>
      </button>
    </form>
  </div>

</body>
</html>
