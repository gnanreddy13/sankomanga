<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#000000">
  <meta name="description" content="Look up Japanese manga: search a title and see the key facts at a glance.">
  <!-- The real title is filled in by common.js from config.js. -->
  <title></title>

  <!-- A tiny icon for the browser tab, drawn inline so there's no extra file. -->
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%2309090b'/%3E%3Crect x='9' y='7' width='14' height='18' rx='2' fill='%23e9e5dc'/%3E%3C/svg%3E">

  <!-- The Inter font, from Google Fonts. "preconnect" starts the
       connection early so the font arrives sooner. -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <!-- "ital,wght@0,…;1,400" = regular 400/500/600 plus a real italic 400
       (for the tagline), so the browser doesn't fake italics by slanting. -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400;0,500;0,600;1,400&display=swap">

  <link rel="stylesheet" href="/static/css/style.css">

  <!-- type="module" lets our scripts import from each other
       (home.js imports config.js and common.js). -->
  <script type="module" src="/static/js/home.js"></script>
</head>
<body>
  <main class="home">
    <div class="hero">

      <!-- Left: a window of popular covers drifting up and down in three
           columns, filled in by home.js. aria-hidden hides it from screen
           readers, since it's only decoration. -->
      <div class="showcase-window" aria-hidden="true">
        <div class="showcase-glow"></div>
        <div class="showcase">
          <div class="showcase-column"><div class="showcase-track"></div></div>
          <div class="showcase-column"><div class="showcase-track"></div></div>
          <div class="showcase-column"><div class="showcase-track"></div></div>
        </div>
      </div>

      <!-- Right: name and tagline level with the top of the covers,
           search level with their bottom. -->
      <div class="home-intro">
        <div class="brand">
          <h1 class="brand-name" data-app-name></h1>
          <p class="brand-tagline" data-tagline></p>
        </div>

        <!-- A plain HTML form: pressing Enter goes to /search?q=...
             even if JavaScript fails to load. -->
        <form class="search search--line" action="/search" method="get" role="search">
          <label class="visually-hidden" for="search-input">Search manga</label>
          <input
            class="search-input"
            id="search-input"
            type="search"
            name="q"
            placeholder="Search a title…"
            maxlength="100"
            autocomplete="off"
            spellcheck="false"
            enterkeyhint="search"
            required
            autofocus>
          <button class="search-button" type="submit" aria-label="Search">
            <!-- A small "return" arrow: press Enter to search. -->
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <path d="M19 5v7a3 3 0 0 1-3 3H6M10 11l-4 4 4 4" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </button>
        </form>
      </div>

    </div>
  </main>

  <footer class="site-footer">
    <!-- AniList's official logo, loaded from their own server (so it's
         always their current logo, in its original colours). The alt
         text means screen readers still announce "Data from AniList". -->
    Data from <a class="footer-logo-link" href="https://anilist.co" target="_blank" rel="noopener noreferrer"><img src="https://anilist.co/img/icons/icon.svg" alt="AniList" width="18" height="18"></a>
  </footer>
</body>
</html>
