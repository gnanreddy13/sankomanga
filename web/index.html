<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#000000">
  <meta name="description" content="Look up Japanese manga: search a title and see the key facts at a glance.">
  <!-- The real title is filled in by common.js from config.js. -->
  <title></title>

  <!-- A tiny icon for the browser tab, drawn inline so there's no extra file. -->
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%2309090b'/%3E%3Crect x='9' y='7' width='14' height='18' rx='2' fill='%23e9e5dc'/%3E%3C/svg%3E">

  <!-- The Inter font, from Google Fonts. "preconnect" starts the
       connection early so the font arrives sooner. -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <!-- "ital,wght@0,…;1,400" = regular 400/500/600, the extra-heavy 900
       (for the big name on the home page), plus a real italic 400 (for the
       tagline), so the browser doesn't fake italics by slanting. -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400;0,500;0,600;0,900;1,400&display=swap">

  <link rel="stylesheet" href="/static/css/style.css">

  <!-- type="module" lets our scripts import from each other
       (home.js imports config.js and common.js). -->
  <script type="module" src="/static/js/home.js"></script>
</head>
<body>
  <main class="home">

    <!-- Top: a row of popular covers gliding slowly to the left. home.js
         fills both rows. aria-hidden hides them from screen readers,
         since they're only decoration. -->
    <div class="cover-row cover-row--top" aria-hidden="true">
      <div class="cover-track"></div>
    </div>

    <!-- Middle: name and tagline, then a quiet hint instead of a search
         bar. The search box opens on top of the page (see
         .search-overlay below and search-overlay.js). -->
    <div class="home-intro">
      <div class="brand">
        <!-- home.js turns the name into the wordmark: SANKO in white
             (taking turns with サンコー), then MANGA as manga art. -->
        <h1 class="brand-name" data-app-name></h1>
        <p class="brand-tagline" data-tagline></p>

        <!-- A caption row under the name, lined up with its edges: the
             search hint on the left, the AniList credit on the right. -->
        <div class="home-captions">
          <!-- A real button, so keyboard and screen-reader users can open
               the search too. The CSS shows the wording that fits the
               device. -->
          <button class="search-hint" type="button" aria-haspopup="dialog">
            <span class="search-hint--keys">Type to search</span>
            <span class="search-hint--touch">Tap to search</span>
          </button>

          <!-- The AniList credit, here instead of in a footer (the other
               pages keep theirs). AniList's official logo, loaded from
               their own server; the alt text means screen readers still
               announce "Data from AniList". -->
          <p class="home-credit">
            Data from <a class="footer-logo-link" href="https://anilist.co" target="_blank" rel="noopener noreferrer"><img src="https://anilist.co/img/icons/icon.svg" alt="AniList" width="14" height="14"></a>
          </p>
        </div>
      </div>
    </div>

    <!-- Bottom: the same covers, gliding the other way. -->
    <div class="cover-row cover-row--bottom" aria-hidden="true">
      <div class="cover-track"></div>
    </div>
  </main>

  <!-- The search box, opened on top of the blurred page by typing, "/",
       clicking or tapping anywhere, or the hint above. Hidden until then.
       It's a plain HTML form: Enter goes to /search?q=... -->
  <div class="search-overlay" role="dialog" aria-modal="true" aria-label="Search manga" hidden>
    <form class="search search--line search--overlay" action="/search" method="get" role="search">
      <label class="visually-hidden" for="search-input">Search manga</label>
      <input
        class="search-input"
        id="search-input"
        type="search"
        name="q"
        placeholder="Search…"
        maxlength="100"
        autocomplete="off"
        spellcheck="false"
        enterkeyhint="search"
        required>
      <button class="search-button" type="submit" aria-label="Search">
        <!-- A magnifying glass (the same icon as "back to search" on the
             title page). Pressing Enter searches too. -->
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <circle cx="10.5" cy="10.5" r="6.5" stroke="currentColor" stroke-width="1.9"/>
          <path d="M15.5 15.5l5 5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        </svg>
      </button>
    </form>
  </div>

</body>
</html>
